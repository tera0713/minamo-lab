<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>SDKの練習</title>
<!-- 1. SDK本体を読み込む -->
<script src="https://cdn.amplitude.com/script/2d914b02133f9f76bc709599df0067f4.js"></script>
<!-- 2. 初期化（どのプロジェクトに送るかをAPIキーで決める） -->
<script>
  window.amplitude.init('2d914b02133f9f76bc709599df0067f4', { autocapture: false });
</script>
</head>
<body>
<h1>SDKの練習</h1>
<button id="b">押すとイベントが飛ぶ</button>
<script>
  // 3. ログインした想定で、会員IDを渡す
  amplitude.setUserId('MNM0000777');
  // 4. 独自のイベントを送る
  document.getElementById('b').addEventListener('click', function () {
    amplitude.track('[SDK練習]ボタンクリック', { ボタン名: '練習ボタン' });
  });
</script>
</body>
</html>
